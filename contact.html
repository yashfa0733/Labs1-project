<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="logo" href="index.html">MyPortfolio<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a class="active" aria-current="page" href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="page-main">
        <section class="page-heading">
            <p class="eyebrow">LET'S CONNECT</p>
            <h1>Contact Me</h1>
            <p>Have a question or want to discuss a project? Send a message.</p>
        </section>
        <form class="contact-form" action="#" method="get">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your full name" minlength="3" required>
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="software-engineer88@gmail.com" required>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" placeholder="Enter a subject" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message..." minlength="10" required></textarea>
            <button class="button" type="submit">Send Message</button>
            <p class="form-note">This lab form demonstrates HTML validation. It does not send messages to a server.</p>
        </form>
    </main>
    <footer class="footer">
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>
</body>

</html>
